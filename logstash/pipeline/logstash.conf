input {
  beats {
    port => 5044
  }
}

filter {
  # 1. HIPAA / Clinical Audit Tagging
  if [event_type] in ["PATIENT_ACCESS", "PRESCRIPTION_ORDER", "HL7_MESSAGE_PROCESSED", "FHIR_RESOURCE_INGESTED"] {
    mutate {
      add_tag => [ "hipaa_audit", "clinical_event" ]
    }
  }

  # Flag controlled substance prescriptions and WARN/ERROR clinical alerts
  if [event_type] == "PRESCRIPTION_ORDER" and [drug_name] =~ /(?i)(Morphine|Fentanyl|Oxycodone|Midazolam|Hydromorphone)/ {
    mutate {
      add_tag => [ "controlled_substance_alert", "high_risk_medication" ]
      add_field => { "compliance_severity" => "HIGH" }
    }
  }

  # 2. HL7 v2 Pipe-Delimited Message Parsing (e.g. MSH|PID|PV1|ORC|RXO)
  if [hl7_raw] {
    mutate {
      add_tag => [ "hl7_v2_parsed" ]
    }
    ruby {
      code => '
        raw = event.get("hl7_raw").to_s
        segments = raw.split(/\r\n|\r|\n|\\n/)
        hl7_data = {}
        segments.each do |seg|
          fields = seg.split("|", -1)
          seg_name = fields[0]
          case seg_name
          when "MSH"
            hl7_data["sending_application"] = fields[2]
            hl7_data["sending_facility"] = fields[3]
            hl7_data["receiving_application"] = fields[4]
            hl7_data["message_type"] = fields[8]
            hl7_data["message_control_id"] = fields[9]
          when "PID"
            hl7_data["patient_identifier"] = fields[3].to_s.split("^")[0]
            hl7_data["patient_name"] = fields[5].to_s.gsub("^", " ").strip
            hl7_data["patient_dob"] = fields[7]
            hl7_data["patient_gender"] = fields[8]
          when "PV1"
            hl7_data["patient_class"] = fields[2]
            hl7_data["assigned_location"] = fields[3]
          when "ORC"
            hl7_data["order_control"] = fields[1]
            hl7_data["placer_order_number"] = fields[2]
          when "RXO"
            hl7_data["requested_medication"] = fields[1]
            hl7_data["requested_dosage"] = "#{fields[2]} #{fields[4]}".strip
          end
        end
        event.set("hl7", hl7_data) unless hl7_data.empty?
      '
    }
  }

  # 3. FHIR R4 Resource Enrichment
  if [fhir_resource_type] {
    mutate {
      add_tag => [ "fhir_r4_parsed" ]
      add_field => {
        "[fhir][resource_type]" => "%{fhir_resource_type}"
        "[fhir][resource_id]" => "%{fhir_resource_id}"
      }
    }
    if [fhir_loinc_code] {
      mutate {
        add_field => { "[fhir][loinc_code]" => "%{fhir_loinc_code}" }
      }
    }
    if [patient_id] {
      mutate {
        add_field => { "[fhir][patient_reference]" => "Patient/%{patient_id}" }
      }
    }
  }

  # 4. Normalize application timestamp when present
  if [@timestamp] {
    date {
      match => [ "@timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "his-clinical-logs-%{+YYYY.MM.dd}"
  }
}
